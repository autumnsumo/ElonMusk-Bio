<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Registration Form</h1>
        <form action="./login.html">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" required placeholder="Enter your password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" required placeholder="Confirm your password">
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="number" required placeholder="Enter your mobile number">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>
            </div>

            <div class="form-group">
                <label>Qualification</label>
                <div class="checkbox-group">
                    <label><input type="checkbox"> 10th</label>
                    <label><input type="checkbox"> 12th</label>
                    <label><input type="checkbox"> Diploma</label>
                    <label><input type="checkbox"> B.Tech</label>
                </div>
            </div>

            <div class="form-group">
                <label>Profile Picture</label>
                <input type="file" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <button type="submit">Register</button>

            <p class="link-text text-center mt-20">
                Already have an account? <a href="./login.html">Login here</a>
            </p>
        </form>
    </div>
</body>

</html>
